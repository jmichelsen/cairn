# backup-monitor - control plane (api) + one uniform agent.
#
# Architecture: the API is a pure control plane - it stores state, serves the dashboard, routes
# intents, and dispatches alerts. It NEVER touches ZFS/borg/disks. All host work is done by
# AGENTS that talk to it over HTTP. This compose runs the API + the LOCAL agent. A remote vault
# runs the SAME agent (agent.py) pointed at this API's public URL + a token - no separate design.
#
# Copy config/backup-monitor.env.example -> config/backup-monitor.env  and
#      config/targets.example.yaml       -> config/targets.yaml, then edit both.

name: backup-monitor

services:
  # ---- control plane: no host access, just serves + stores + alerts ----
  api:
    build: .
    image: backup-monitor:latest
    command: ["api"]
    env_file: [./config/backup-monitor.env]     # SMTP + Gotify creds live ONLY here (the API alerts)
    environment:
      BM_DB: /data/backup-monitor.db
      STATE_DIR: /data/state
    volumes:
      - bmdata:/data
      - ./config:/config:ro
    ports:
      - "8929:8929"
    restart: unless-stopped

  # ---- local agent: reads THIS host's ZFS/borg/backupninja and reports to the API ----
  agent:
    build: .
    image: backup-monitor:latest
    command: ["agent"]
    environment:
      BM_API_URL: http://api:8929
      BM_API_TOKEN: ${BM_API_TOKEN:?set BM_API_TOKEN in your environment or an .env file}
      BM_AGENT_NAME: local
      BM_TARGETS: /config/targets.yaml
      BM_INTERVAL: "900"
      # Report-only by default. To let this agent EXECUTE actions (syncoid/scrub/snapshot) it needs
      # ZFS WRITE privilege - set BM_CAN_EXECUTE=1 AND add cap_add: [SYS_ADMIN] below (or, safer,
      # run agent.py directly on the host as root instead of in this container).
      BM_CAN_EXECUTE: "0"
    devices:
      - /dev/zfs:/dev/zfs                       # ZFS reads (unprivileged)
    volumes:
      - ./config:/config:ro
      # borg repos + backupninja, read-only (edit to your paths; omit if unused):
      - /mnt/backups:/mnt/backups:ro
      - /srv/borg-pre:/srv/borg-pre:ro
      - /var/log/backupninja.log:/var/log/backupninja.log:ro
      - /var/lib/backupninja/reports:/var/lib/backupninja/reports:ro
      # SMART (optional): cap_add: [SYS_RAWIO] + devices: [/dev/sda, ...]
    # To enable local actions in-container (instead of a host agent):
    # cap_add: [SYS_ADMIN]
    restart: unless-stopped
    depends_on: [api]

volumes:
  bmdata:
