# cairn - control plane (api) + one uniform agent.
#
# Architecture: the API is a pure control plane - it stores state, serves the dashboard, routes
# intents, and dispatches alerts. It NEVER touches ZFS/borg/disks. All host work is done by
# AGENTS that talk to it over HTTP. By default this compose runs the API only; an optional
# report-only container agent sits behind the `container-agent` profile. A remote vault runs the
# SAME agent (agent.py) pointed at this API's URL + a token - no separate design.
#
# Setup (all config lives in ONE file - no hidden .env):
#   cp config/cairn.env.example config/cairn.env   # set the 3 tokens + SMTP/Gotify
#   cp config/targets.example.yaml       config/targets.yaml         # list YOUR pools/datasets/repos
#   # then pick ONE deploy mode:
#   docker compose up -d --build          # HOST mode (default): api only - pair with the execute-
#                                         #   capable host agent from AGENT.md / install.sh
#                                         #   (install.sh home does exactly this).
#   docker compose --profile container-agent up -d --build
#                                         # CONTAINER mode: api + the report-only container agent
#                                         #   (edit its borg/backupninja mounts below first).
#   Never run both modes: both agents report this host's targets (same name: they overwrite each
#   other; different names: every dataset shows up twice).
#   podman-compose works the same way (profiles need podman-compose 1.0.6+).

name: cairn

services:
  # ---- control plane: no host access, just serves + stores + alerts ----
  api:
    build: .
    image: cairn:latest
    command: ["api"]
    env_file: [./config/cairn.env]     # tokens + SMTP + Gotify all come from this one file
    environment:
      CAIRN_DB: /data/cairn.db
      STATE_DIR: /data/state
    volumes:
      - data:/data
      - ./config:/config:ro
    ports:
      - "8929:8929"
    healthcheck:
      test: ["CMD", "curl", "-fs", "-o", "/dev/null", "http://localhost:8929/login"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # ---- local agent: reads THIS host's ZFS/borg/backupninja and reports to the API ----
  # Opt-in (profile `container-agent`): a plain `docker compose up` does NOT start it, so it can't
  # collide with the host agent that install.sh sets up. Running this container AND the host agent =
  # two agents reporting one host's targets.
  agent:
    profiles: ["container-agent"]
    build: .
    image: cairn:latest
    command: ["agent"]
    env_file: [./config/cairn.env]     # provides CAIRN_API_TOKEN (this agent's token)
    environment:
      CAIRN_API_URL: http://api:8929
      CAIRN_AGENT_NAME: local
      CAIRN_TARGETS: /config/targets.yaml
      CAIRN_INTERVAL: "900"
      # Report-only. Leave this at 0: the image has no syncoid, rsync, sudo, httm or journalctl, so
      # actions cannot run in this container. To run actions, use the host agent (AGENT.md).
      CAIRN_CAN_EXECUTE: "0"
    devices:
      - /dev/zfs:/dev/zfs                       # ZFS reads (unprivileged)
    volumes:
      - ./config:/config:ro
      # borg repos + backupninja, read-only (EDIT these to your own repo paths; omit if unused):
      - /path/to/your/borg/repos:/path/to/your/borg/repos:ro
      - /var/log/backupninja.log:/var/log/backupninja.log:ro
      - /var/lib/backupninja/reports:/var/lib/backupninja/reports:ro
      # kernel disk/link error watch (rsyslog plain-text log): mount it ro so the RO container
      # can catch transient drops/resilver storms. Journald-only hosts: mount /var/log/journal:ro
      # + /etc/machine-id:ro instead and add journalctl to the image, or use the host agent.
      - /var/log/kern.log:/var/log/kern.log:ro
      # SMART (optional): cap_add: [SYS_RAWIO] + devices: [/dev/sda, ...]
    restart: unless-stopped
    depends_on: [api]

volumes:
  data:
