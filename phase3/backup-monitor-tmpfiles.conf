# /etc/tmpfiles.d/backup-monitor.conf - the intent queue dir on tmpfs (recreated at boot).
# Owned by jmichelsen so the (unprivileged) API can drop *.intent files; the root runner
# reads + removes them. /run is cleared on reboot, so systemd-tmpfiles recreates this.
d /run/backup-intents 0755 jmichelsen jmichelsen -
