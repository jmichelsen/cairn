# CI for the Cairn OSS repo. github.com/jmichelsen/cairn is the public mirror; this pipeline runs on
# the GitLab origin (mclife-hosted/cairn) and its status is surfaced on the GitHub README via badges.
#
# It guards the two things that have silently broken the dashboard: a Python-escaping slip in the
# inline JS (which kills every button with no server error - see tools/check_js.py), and regressions
# in the server-side rendering / collector logic (the unit tests). Runs on every push and MR.
stages: [test]

lint-and-test:
  stage: test
  image: python:3.12-slim
  tags: [mclife-deploy]          # the mclife-hosted group runner (docker executor)
  rules:
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  before_script:
    - apt-get update -qq && apt-get install -y --no-install-recommends nodejs >/dev/null
    - pip install --no-cache-dir pyyaml "fastapi>=0.110" "uvicorn[standard]>=0.29" pytest >/dev/null
  script:
    - 'echo "== Python syntax =="'
    - python3 -m py_compile phase1/*.py agent.py
    - 'echo "== inline dashboard JS (node --check) =="'
    - python3 tools/check_js.py
    - 'echo "== unit tests =="'
    - python3 -m pytest -q
