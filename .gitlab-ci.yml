# CI for the Cairn OSS repo. github.com/jmichelsen/cairn is the public mirror; this pipeline runs on
# the GitLab origin (mclife-hosted/cairn) and its status is surfaced on the GitHub README via badges.
#
# It guards the two things that have silently broken the dashboard: a Python-escaping slip in the
# inline JS (which kills every button with no server error - see tools/check_js.py), and regressions
# in the server-side rendering / collector logic (the unit tests). Runs on every push and MR.
stages: [test]

lint-and-test:
  stage: test
  image: docker:27-cli
  tags: [mclife-deploy]          # the mclife-hosted group runner (docker executor, host docker socket)
  rules:
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    # The Dockerfile's `ci` target adds nodejs (for check_js's `node --check`) + pytest and runs the checks
    # (py_compile + check_js + pytest) as its final layer; a failed build IS a failed test. It shares the
    # `deps` base with the production `runtime` target, so CI tests the exact versions prod ships. BuildKit
    # inline cache + --cache-from reuse the deps across runs, so this is seconds once warm (same host daemon
    # / cairn-ci:latest tag the deploy pipeline warms).
    - DOCKER_BUILDKIT=1 docker build --progress=plain --target ci --build-arg BUILDKIT_INLINE_CACHE=1 --cache-from cairn-ci:latest -t cairn-ci:latest -f Dockerfile .
